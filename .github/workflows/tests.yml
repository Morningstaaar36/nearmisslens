name: tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    env:
      # empty data, cache and run folders: the tests must pass on a fresh clone with no keys and no downloads
      NML_DATA: ${{ runner.temp }}/data
      NML_CACHE: ${{ runner.temp }}/cache
      NML_RUNS: ${{ runner.temp }}/runs
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync
      - run: uv run pytest -q
