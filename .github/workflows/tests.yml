name: tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      # empty data, cache and run folders: the tests must pass on a fresh clone with no keys and no downloads
      - run: |
          echo "NML_DATA=$RUNNER_TEMP/data" >> "$GITHUB_ENV"
          echo "NML_CACHE=$RUNNER_TEMP/cache" >> "$GITHUB_ENV"
          echo "NML_RUNS=$RUNNER_TEMP/runs" >> "$GITHUB_ENV"
      - run: uv sync
      - run: uv run pytest -q
